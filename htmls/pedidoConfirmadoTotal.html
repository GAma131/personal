<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #ffffff;">
        <tr>
            <td align="center" style="padding: 20px;">
                <table width="600" cellpadding="0" cellspacing="0" class="pedido-confirmado-container fondo-blanco">
                    <tr>
                        <td class="pedido-confirmado-icon-td">
                            <div class="pedido-confirmado-icon">
                                <img src="https://einfo.petco.com.mx/custloads/765664703/md_1779615.png" alt="Pedido confirmado" class="confirmado-icono-total">
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="pedido-confirmado-card fondo-azul-petco">
                            <div class="pedido-confirmado-content">
                                <h1 class="pedido-confirmado-title texto-3xl font-bold texto-blanco">Hemos entregado exitosamente todos tus productos</h1>
                                <p class="pedido-confirmado-total-subtitle font-light texto-md font-normal texto-blanco">¡Gracias por confiar en nosotros para cuidar a quienes más quieres!</p>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
