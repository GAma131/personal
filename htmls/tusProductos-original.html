<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="estilos.css">
</head>

<body>
  <div class="mail-ped-caja-uno">
    <br>


    <table class="tablita">
      <thead>
        <th class="hDesc" colspan="2">
          <p>Descripci&oacute;n</p>
        </th>
        <th class="hQuantity">
          <p>Cantidad</p>
        </th>
        <th class="hPrice">
          <p>
            Precio
          </p>
        </th>
      </thead>

      {% foreach item in event.order.entries limit 10 %}
      <tr>
        <td>
          <img src="{{item.imageSrc}}" alt="" style="max-width: 150px; width: 150px; margin: 10px; float: left;"
            width="150" class="CToWUd a6T" data-bit="iit" tabindex="0">
        </td>
        <td class="description-format">
          {{item.description}}
        </td>
        <td class="tdL">
          {{item.quantity}}
        </td>
        <td class="tdL myPriceR">
          {{item.price}}
        </td>
      </tr>
      <tr>
        <td colspan="4">
          <hr />
        </td>
      </tr>
      {% endforeach %}
      <tr>
        <td colspan="3" class="labelsTotals">
          <b>Cupones</b>
        </td>
        <td class="tdL myPriceR">
          {{event.order.coupons}}
        </td>
      </tr>
      <tr>
        <td colspan="3" class="labelsTotals">
          <b>Descuento PEB({{event.order.descuentoPct}})</b>
        </td>
        <td class="tdL myPriceR">
          {{event.order.discountPEB}}
        </td>
      </tr>
      <tr>
        <td colspan="3" class="labelsTotals">
          <b>Env&iacute;o</b>
        </td>
        <td class="tdL myPriceR">
          GRATIS
        </td>
      </tr>
      <tr>
        <td colspan="3" class="labelsTotals">
          <b>Total</b>
        </td>
        <td class="tdL myPriceR">
          {{event.order.total}}
        </td>
      </tr>
      <tr>
        <td colspan="5" class="labelsTotals">
          <center>
            <div style="height: 8px;"></div>
          </center>
        </td>
      </tr>
    </table>

  </div>
</body>

</html>
