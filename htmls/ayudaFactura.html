<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="estilos.css">
</head>

<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="factura-container fondo-gris-claro">
    <tr>
      <td>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>

            <!-- imagen -->
            <td class="factura-img">
              <img src="https://einfo.petco.com.mx/custloads/765664703/md_1778790.png" alt="Gato" width="100">
            </td>

            <!-- texto -->
            <td class="factura-text texto-azul-petco texto-2xl font-bold">
              ¿Necesitas facturar tu compra?
            </td>

            <!-- boton -->
            <td class="factura-btn-cell">
              <a href="https://factura.petco.com.mx" class="factura-btn fondo-azul-petco texto-md texto-blanco">
                Facturar mi compra
              </a>
            </td>

          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>

</html>
