<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #ffffff;">
        <tr>
            <td align="center" style="padding: 20px;">
                <table width="600" cellpadding="0" cellspacing="0" class="pedido-confirmado-container">
                    <tr>
                        <td class="pedido-confirmado-icon-td">
                            <div class="pedido-confirmado-icon">
                                <img src="resources/pedidoConfirmado.png" alt="Pedido confirmado" class="confirmado-icono">
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td class="pedido-confirmado-card">
                            <div class="pedido-confirmado-content">
                                <h1 class="pedido-confirmado-title">Tu pedido ha sido confirmado</h1>
                                <p class="pedido-confirmado-subtitle">En breve recibirás el seguimiento de tu pedido.</p>
                            </div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
