<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="estilos.css">
</head>

<body>

  <table width="680" cellpadding="0" cellspacing="0" border="0" align="center" class="fondo-blanco stepper-wrapper">
    <tr>

      <td class="pedido-confirmado-icon-td">
        <div class="pedido-confirmado-icon">
          <img src="https://einfo.petco.com.mx/custloads/765664703/md_1778792.png" alt="Pedido confirmado"
            class="confirmado-icono">
        </div>
      </td>

    </tr>
  </table>

  <!-- BANNER: ESTAMOS PREPARANDO TU PEDIDO -->
  <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#00205B"
    class="fondo-azul-petco banner-preparando-wrapper">
    <tr>
      <td align="center" class="banner-preparando-td">
        <p class="banner-preparando-titulo texto-3xl font-normal texto-blanco">Estamos preparando tu pedido</p>
        <p class="banner-preparando-subtitulo texto-md font-light texto-blanco">Te avisaremos cuando salga en camino a
          tu domicilio.</p>
      </td>
    </tr>
  </table>

  <!-- SECCIÓN: FECHA DE ENTREGA -->
  <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#FFFBD4"
    class="entrega-wrapper">
    <tr>
      <td class="entrega-td" align="center">
        <table cellpadding="0" cellspacing="0" border="0" align="center">
          <tr>
            <td align="center" valign="middle" class="entrega-icono-td" style="padding-right: 15px;">
              <img src="https://einfo.petco.com.mx/custloads/765664703/md_1779430.png" width="28"
                alt="Fecha de entrega" />
            </td>
            <td class="entrega-texto-td">
              <p class="entrega-texto texto-sm texto-azul-petco" style="text-align: center;">
                Tu pedido se enviará en <strong>dos o más paquetes.</strong></br> Recibiras un correo con el detalle y
                seguimiento de cada uno.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

</body>

</html>
