<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <table width="680" cellpadding="0" cellspacing="0" border="0" align="center" class="fondo-blanco stepper-wrapper">
    <tr>
      <!-- PASO 1: tu pedido ya cuenta con guía (ACTIVO) -->
      <td align="center" valign="top" class="step-td">
        <table cellpadding="0" cellspacing="0" border="0" align="center">
          <tr>
            <td align="center" valign="middle" width="50" height="50" bgcolor="#00205B"
              class="step-icon-circle step-circle-active">
              <img src="https://einfo.petco.com.mx/custloads/765664703/md_1779424.png" width="33"
                alt="Pedido confirmado" style="margin:0 auto; padding-left: 5px;" />
            </td>
          </tr>
        </table>
        <p class="step-label step-label-active texto-base font-bold texto-azul-petco">Pedido<br>confirmado</p>
      </td>

      <!-- SEPARADOR -->
      <td align="center" valign="middle" class="step-separator-td">
        <img src="https://einfo.petco.com.mx/custloads/765664703/md_1779425.png" width="20" alt=""
          style="display:block; margin:0 auto" />
      </td>

      <!-- PASO 2: Pedido preparado (INACTIVO) -->
      <td align="center" valign="top" class="step-td">
        <table cellpadding="0" cellspacing="0" border="0" align="center">
          <tr>
            <td align="center" valign="middle" width="50" height="50"
              class="step-icon-circle step-circle-active">
              <img src="https://einfo.petco.com.mx/custloads/765664703/md_1779426.png" width="28" alt="Pedido preparado"
                style="margin:0 auto; padding-top:5px; padding-left:3px;" />
            </td>
          </tr>
        </table>
        <p class="step-label step-label-active texto-base font-bold texto-azul-petco">Pedido<br>preparado</p>
      </td>

      <!-- SEPARADOR -->
      <td align="center" valign="middle" class="step-separator-td">
        <img src="https://einfo.petco.com.mx/custloads/765664703/md_1779425.png" width="20" alt=""
          style="display:block; margin:0 auto" />
      </td>

      <!-- PASO 3: Pedido en tránsito (INACTIVO) -->
      <td align="center" valign="top" class="step-td">
        <table cellpadding="0" cellspacing="0" border="0" align="center">
          <tr>
            <td align="center" valign="middle" width="50" height="50"
              class="step-icon-circle step-circle-active">
              <img src="https://einfo.petco.com.mx/custloads/765664703/md_1779427.png" width="40"
                alt="Pedido en tránsito" style="margin:0 auto; padding-top: 3px;" />
            </td>
          </tr>
        </table>
        <p class="step-label texto-base font-bold texto-claro">Pedido en<br>tránsito</p>
      </td>

      <!-- SEPARADOR -->
      <td align="center" valign="middle" class="step-separator-td">
        <img src="https://einfo.petco.com.mx/custloads/765664703/md_1779425.png" width="20" alt=""
          style="display:block; margin:0 auto" />
      </td>

      <!-- PASO 4: Pedido entregado (INACTIVO) -->
      <td align="center" valign="top" class="step-td">
        <table cellpadding="0" cellspacing="0" border="0" align="center">
          <tr>
            <td align="center" valign="middle" width="50" height="50" 
              class="step-icon-circle step-circle-active">
              <img src="https://einfo.petco.com.mx/custloads/765664703/md_1779428.png" width="35" alt="Pedido entregado"
                style="margin:0 auto;" />
            </td>
          </tr>
        </table>
        <p class="step-label texto-base font-bold texto-claro">Pedido<br>entregado</p>
      </td>

    </tr>
  </table>

  <!-- SECCIÓN: Entregado -->
  <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#00205B" class="fondo-azul-petco banner-preparando-wrapper-only">
    <tr>
      <td align="center" class="banner-preparando-td-only">
        <p class="banner-preparando-titulo texto-3xl font-bold texto-blanco">Tu pedido fue entregado</p>
        <p class="banner-preparando-subtitulo texto-md font-light texto-blanco">¡Agradecemos tu compra! Que la disfrutes</p>
      </td>
    </tr>
  </table>

</body>
</html>
