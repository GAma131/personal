<!DOCTYPE html>
<html lang="es">

<head>

<body>

  </tr>

  <!-- BOTONES -->

    <td class="contacto-botones-td">

          <!-- Email -->
          <td align="center" class="contacto-btn-td">

              sclientes@petco.com.mx
            </a>
          </td>

          <td align="center" class="contacto-btn-td">
            <a href="tel:8003273826" class="contacto-btn fondo-azul-petco texto-lg font-light texto-blanco">

              800 32 73 826
            </a>
          </td>
