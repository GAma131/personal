      </td>
    </tr>
  </table>

  <!-- BANNER: TU PEDIDO ESTÁ EN TRÁNSITO -->
  <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#00205B" class="fondo-azul-petco banner-preparando-wrapper">
    <tr>
      <td align="center" class="banner-preparando-td">
        <p class="banner-preparando-titulo texto-3xl font-bold texto-blanco">Tu pedido está en tránsito</p>
        <p class="banner-preparando-subtitulo texto-md texto-blanco">Tu compra va en camino a tu domicilio.</p>
      </td>
    </tr>
  </table>

  <!-- SECCIÓN: FECHA DE ENTREGA -->
  <table width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#DFF3E4" class="entrega-wrapper">
    <tr>
      <td class="entrega-td">

          <tr>
            <td width="50" align="center" valign="middle" class="entrega-icono-td">
              <img src="./resources/mail.png" width="38" alt="Fecha de entrega" style="display:block;" />
            </td>
            <td valign="middle" class="entrega-texto-td">
              <p class="entrega-texto texto-sm texto-azul-petco">
                Recuerda que tu entrega se realizará entre el <strong>{{event.fechaInicio}}</strong> y el <strong>{{event.fechaFin}}.</strong> Nuestro horario de entrega es de <strong>{{event.horaInicio}}</strong> a <strong>{{event.horaFin}}.</strong>
